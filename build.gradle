plugins {
	id 'java'
}

repositories {
	maven { url = 'https://repo.runelite.net' }
	mavenCentral()
}

def runeLiteVersion = findProperty('runeLiteVersion') ?: 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
	testImplementation 'junit:junit:4.12'
}

group = 'com.wackysire'
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.wackysire.WackySireLauncher'
	jvmArgs '-ea'
	args '--developer-mode', '--debug'
}

tasks.register('exportPreview', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.wackysire.MeshPreview'
	def outputFile = layout.buildDirectory.file('preview/poses.json')
	doFirst { outputFile.get().asFile.parentFile.mkdirs() }
	args outputFile.get().asFile.absolutePath
}
